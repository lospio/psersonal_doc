#!/usr/bin/env ansible-playbook
---
- name: begin
  become: yes
  hosts: cn_node 
  # roles:
  # - role: collector
  # - role: analyzer
  # - role: publisher
  tasks: 
    - name: echo sql fiel
      shell: 
        chdir: "{{ansible_dir}}"
        cmd: echo "{{slow_sql}}" > slow_sql.sql

    - name: run pg_bench
      shell:
        chdir: "{{ansible_dir}}"
        cmd: nohup /usr/pgsql/10_debug_o2/bin/./pgbench  -c 1 -j 1 -n -s 100 -T 300 -f {{ansible_dir}}/slow_sql.sql -U postgres -h localhost &

    - name: get pid
      shell: ps -efw --sort=-pid |grep pgbench |grep -v grep |sed -n '1p' |awk '{print $2}'
      register: target_pid
    
    - name: add pid
      shell: expr {{target_pid.stdout}} + 2 | cat
      register: num

    - name: perf record
      shell:
        chdir: "{{ansible_dir}}"
        cmd: perf record -F 99 --call-graph dwarf -p {{num.stdout}} -- sleep 180

    - name: perf script
      shell: 
        chdir: "{{ansible_dir}}"
        cmd: perf script | stackcollapse-perf.pl > test.perf-folded
    
    - name: flamegraph
      shell: 
        chdir: "{{ansible_dir}}"
        cmd: flamegraph.pl test.perf-folded > test.svg

